<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Analizador de Bádminton</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 15px; background: #f8f9fa; }
    .container { max-width: 1300px; margin: auto; }
    .player-section { margin-bottom: 20px; }
    iframe { width: 100%; height: 400px; border: none; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .controls-bar { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; margin: 15px 0; background: white; padding: 12px; border-radius: 8px; }
    .controls-bar input { flex: 1; min-width: 250px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
    .btn { padding: 10px 18px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn:hover { background: #0056b3; }
    .btn-sm { padding: 6px 12px; font-size: 0.85rem; }
    .btn-success { background: #28a745; }
    .btn-success:hover { background: #1e7e34; }
    .btn-danger { background: #dc3545; }
    .btn-danger:hover { background: #a71d2a; }
    .btn-warning { background: #ffc107; color: #212529; }
    .btn-warning:hover { background: #d39e00; }

    .golpes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin: 20px 0; }
    .golpe-card { background: white; border-radius: 10px; padding: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .golpe-nombre { font-weight: bold; font-size: 1.1rem; margin-bottom: 10px; text-align: center; color: #333; }
    .botones-golpe { display: flex; gap: 8px; }
    .btn-golpe { flex: 1; padding: 12px 5px; border: 2px solid; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.2s; position: relative; }
    .btn-paralelo { background: #e3f2fd; border-color: #2196F3; color: #0d47a1; }
    .btn-paralelo:hover { background: #bbdefb; }
    .btn-cruzado { background: #fce4ec; border-color: #e91e63; color: #880e4f; }
    .btn-cruzado:hover { background: #f8bbd0; }
    .badge { position: absolute; top: -8px; right: -8px; background: #333; color: white; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; }

    .jugador-selector { display: flex; align-items: center; gap: 8px; }
    .jugador-selector select { padding: 8px; border-radius: 5px; border: 1px solid #ccc; }
    .stats-panel { background: white; border-radius: 10px; padding: 15px; margin-top: 20px; }
    .stats-panel h3 { margin-top: 0; }
    .table-events { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .table-events th, .table-events td { border: 1px solid #dee2e6; padding: 8px; text-align: left; }
    .table-events th { background: #e9ecef; }

    .hidden { display: none; }
    .loading-msg { color: #6c757d; margin-left: 10px; }
  </style>
</head>
<body>
<div class="container">

  <!-- Reproductor -->
  <div class="player-section">
    <div id="player-wrapper">
      <iframe id="youtube-frame" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    </div>
    <div class="controls-bar">
      <input type="text" id="urlInput" placeholder="Pega aquí el enlace de YouTube" value="https://www.youtube.com/watch?v=bTqG6zFnj3E">
      <button class="btn" onclick="cargarVideo()">▶️ Cargar</button>
      <span id="loading" class="loading-msg hidden">Cargando...</span>
      <span id="errorMsg" class="loading-msg hidden" style="color: red;"></span>
    </div>
  </div>

  <!-- Selector de jugador -->
  <div class="controls-bar">
    <div class="jugador-selector">
      <label><strong>Jugador actual:</strong></label>
      <select id="jugadorActual"></select>
      <button class="btn btn-sm btn-success" onclick="agregarJugador()">➕ Añadir</button>
    </div>
    <div>
      <button class="btn btn-sm btn-warning" onclick="reiniciarContadores()">🔄 Reiniciar contadores</button>
      <button class="btn btn-sm btn-danger" onclick="alternarEventos()">📋 Ver/Ocultar eventos registrados</button>
    </div>
  </div>

  <!-- Botones de golpes -->
  <h2>Registro rápido de golpes</h2>
  <div id="golpesContainer" class="golpes-grid"></div>

  <!-- Panel de eventos registrados (oculto por defecto) -->
  <div id="panelEventos" class="stats-panel hidden">
    <h3>Eventos registrados</h3>
    <table class="table-events">
      <thead><tr><th>Jugador</th><th>Tiempo</th><th>Golpe</th></tr></thead>
      <tbody id="tablaEventos"></tbody>
    </table>
  </div>

</div>

<script>
  // ---------- CONFIGURACIÓN ----------
  const golpesBase = [
    'Clear', 'Drop', 'Drop Slice', 'Smash', 'Stick Smash',
    'Bloqueo', 'Defensa', 'Defensa profunda', 'Lob', 'Lift', 'Dejada'
  ];
  const direcciones = ['Paralelo', 'Cruzado'];

  // Estado
  let iframe;
  let jugadores = JSON.parse(localStorage.getItem('jugadoresBadminton') || '[]');
  let jugadorSeleccionado = localStorage.getItem('jugadorActualBadminton') || '';
  let contadores = {};   // { "Clear Paralelo": número }
  let eventos = [];      // Para la tabla detallada

  // Inicializar contadores
  function inicializarContadores() {
    golpesBase.forEach(golpe => {
      direcciones.forEach(dir => {
        const clave = `${golpe} ${dir}`;
        if (!(clave in contadores)) contadores[clave] = 0;
      });
      // Total por golpe (opcional)
      if (!(`_total_${golpe}` in contadores)) contadores[`_total_${golpe}`] = 0;
    });
  }
  inicializarContadores();

  // Guardar contadores en localStorage (opcional)
  function guardarContadores() {
    localStorage.setItem('contadoresBadminton', JSON.stringify(contadores));
  }
  function cargarContadores() {
    const guardados = JSON.parse(localStorage.getItem('contadoresBadminton') || '{}');
    if (Object.keys(guardados).length > 0) {
      contadores = guardados;
    }
  }
  cargarContadores();

  // ---------- VIDEO ----------
  function extraerID(url) {
    const regex = /(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:watch\?v=|embed\/|v\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
    const match = url.match(regex);
    return match ? match[1] : null;
  }

  function cargarVideo() {
    const url = document.getElementById('urlInput').value.trim();
    document.getElementById('errorMsg').classList.add('hidden');
    document.getElementById('loading').classList.remove('hidden');
    if (!url) {
      mostrarError('Por favor pega un enlace de YouTube.');
      return;
    }
    const videoId = extraerID(url);
    if (!videoId) {
      mostrarError('No se pudo extraer el ID del vídeo. Revisa el enlace.');
      return;
    }
    iframe = document.getElementById('youtube-frame');
    iframe.src = `https://www.youtube.com/embed/${videoId}?enablejsapi=1&origin=${encodeURIComponent(window.location.origin)}`;
    iframe.style.display = 'block';
    document.getElementById('loading').classList.add('hidden');
  }

  function mostrarError(mensaje) {
    const err = document.getElementById('errorMsg');
    err.textContent = mensaje;
    err.classList.remove('hidden');
    document.getElementById('loading').classList.add('hidden');
  }

  // Obtener tiempo actual del iframe
  window.addEventListener('message', (event) => {
    if (event.origin !== 'https://www.youtube.com') return;
    try {
      const data = JSON.parse(event.data);
      if (data.event === 'infoDelivery' && data.info && data.info.currentTime) {
        window.iframeCurrentTime = data.info.currentTime;
      }
    } catch(e) {}
  });

  function solicitarTiempo() {
    if (!iframe || !iframe.contentWindow) return;
    iframe.contentWindow.postMessage('{"event":"listening","id":1}', 'https://www.youtube.com');
  }
  setInterval(solicitarTiempo, 500);

  // ---------- JUGADORES ----------
  function actualizarListaJugadores() {
    const select = document.getElementById('jugadorActual');
    select.innerHTML = jugadores.map(j => `<option value="${j}" ${j === jugadorSeleccionado ? 'selected' : ''}>${j}</option>`).join('');
    if (jugadores.length === 0) {
      select.innerHTML = '<option value="">-- Sin jugador --</option>';
    }
  }

  function agregarJugador() {
    const nombre = prompt('Nombre del jugador:');
    if (nombre && !jugadores.includes(nombre)) {
      jugadores.push(nombre);
      localStorage.setItem('jugadoresBadminton', JSON.stringify(jugadores));
      jugadorSeleccionado = nombre;
      localStorage.setItem('jugadorActualBadminton', nombre);
      actualizarListaJugadores();
    }
  }

  document.getElementById('jugadorActual').addEventListener('change', (e) => {
    jugadorSeleccionado = e.target.value;
    localStorage.setItem('jugadorActualBadminton', jugadorSeleccionado);
  });

  // ---------- REGISTRO DE GOLPES ----------
  function registrarGolpe(golpe, direccion) {
    if (!iframe || !iframe.src) {
      alert('Carga un video primero.');
      return;
    }
    if (!jugadorSeleccionado) {
      alert('Selecciona o añade un jugador primero.');
      return;
    }
    const tiempo = window.iframeCurrentTime;
    if (tiempo === undefined || tiempo === null) {
      alert('No se pudo obtener el tiempo del video. Espera unos segundos.');
      solicitarTiempo();
      return;
    }

    const clave = `${golpe} ${direccion}`;
    // Actualizar contadores
    contadores[clave] = (contadores[clave] || 0) + 1;
    contadores[`_total_${golpe}`] = (contadores[`_total_${golpe}`] || 0) + 1;

    guardarContadores();
    actualizarBotonesContadores();

    // Registrar evento en tabla
    const minutos = Math.floor(tiempo / 60);
    const segundos = Math.floor(tiempo % 60);
    const tiempoFormateado = `${minutos}:${segundos.toString().padStart(2, '0')}`;

    eventos.push({ jugador: jugadorSeleccionado, tiempo, tipo: clave });
    agregarFilaTabla(jugadorSeleccionado, tiempoFormateado, clave);
  }

  function agregarFilaTabla(jugador, tiempoFormateado, tipo) {
    const tbody = document.getElementById('tablaEventos');
    const fila = tbody.insertRow();
    fila.innerHTML = `<td>${jugador}</td><td>${tiempoFormateado}</td><td>${tipo}</td>`;
  }

  // ---------- INTERFAZ DE BOTONES ----------
  function crearBotones() {
    const container = document.getElementById('golpesContainer');
    container.innerHTML = '';

    golpesBase.forEach(golpe => {
      const card = document.createElement('div');
      card.className = 'golpe-card';

      const nombre = document.createElement('div');
      nombre.className = 'golpe-nombre';
      nombre.textContent = golpe;
      card.appendChild(nombre);

      const botonesDiv = document.createElement('div');
      botonesDiv.className = 'botones-golpe';

      direcciones.forEach(dir => {
        const clave = `${golpe} ${dir}`;
        const btn = document.createElement('button');
        btn.className = `btn-golpe ${dir === 'Paralelo' ? 'btn-paralelo' : 'btn-cruzado'}`;
        btn.innerHTML = `${dir} <span class="badge" id="cont-${clave.replace(/\s/g, '_')}">${contadores[clave] || 0}</span>`;
        btn.addEventListener('click', () => registrarGolpe(golpe, dir));
        botonesDiv.appendChild(btn);
      });

      card.appendChild(botonesDiv);
      container.appendChild(card);
    });
  }

  function actualizarBotonesContadores() {
    golpesBase.forEach(golpe => {
      direcciones.forEach(dir => {
        const clave = `${golpe} ${dir}`;
        const badge = document.getElementById(`cont-${clave.replace(/\s/g, '_')}`);
        if (badge) {
          badge.textContent = contadores[clave] || 0;
        }
      });
    });
  }

  function reiniciarContadores() {
    if (confirm('¿Estás seguro de reiniciar todos los contadores y eventos?')) {
      contadores = {};
      inicializarContadores();
      guardarContadores();
      eventos = [];
      document.getElementById('tablaEventos').innerHTML = '';
      actualizarBotonesContadores();
    }
  }

  // Mostrar/ocultar tabla de eventos
  function alternarEventos() {
    document.getElementById('panelEventos').classList.toggle('hidden');
  }

  // ---------- INICIALIZACIÓN ----------
  actualizarListaJugadores();
  crearBotones();
  cargarVideo(); // Carga el video por defecto (puedes eliminar esta línea si prefieres empezar sin video)
</script>
</body>
</html>
