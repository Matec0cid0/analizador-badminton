<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analizador de Bádminton</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 15px; background: #f8f9fa; }
    .container { max-width: 1300px; margin: auto; }

    .player-section { margin-bottom: 20px; }
    #player-wrapper {
      position: relative; width: 100%; padding-bottom: 56.25%; background: #000;
      border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    #player-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

    .controls-bar {
      display: flex; gap: 15px; align-items: center; flex-wrap: wrap;
      margin: 15px 0; background: white; padding: 12px; border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .controls-bar input { flex: 1; min-width: 250px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
    .btn {
      padding: 10px 18px; background: #007bff; color: white; border: none; border-radius: 5px;
      cursor: pointer; font-weight: bold; transition: 0.2s; white-space: nowrap;
    }
    .btn:hover { background: #0056b3; }
    .btn-sm { padding: 6px 12px; font-size: 0.85rem; }
    .btn-success { background: #28a745; } .btn-success:hover { background: #1e7e34; }
    .btn-danger { background: #dc3545; } .btn-danger:hover { background: #a71d2a; }
    .btn-warning { background: #ffc107; color: #212529; } .btn-warning:hover { background: #d39e00; }
    .btn-info { background: #17a2b8; } .btn-info:hover { background: #117a8b; }

    .golpes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin: 20px 0; }
    .golpe-card {
      background: white; border-radius: 10px; padding: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .golpe-nombre { font-weight: bold; font-size: 1.1rem; margin-bottom: 10px; text-align: center; color: #333; }
    .botones-golpe { display: flex; gap: 8px; }
    .btn-golpe {
      flex: 1; padding: 12px 5px; border: 2px solid; border-radius: 8px;
      font-weight: bold; cursor: pointer; transition: all 0.2s; position: relative;
    }
    .btn-paralelo { background: #e3f2fd; border-color: #2196F3; color: #0d47a1; }
    .btn-paralelo:hover { background: #bbdefb; }
    .btn-cruzado { background: #fce4ec; border-color: #e91e63; color: #880e4f; }
    .btn-cruzado:hover { background: #f8bbd0; }
    .badge {
      position: absolute; top: -8px; right: -8px; background: #333; color: white;
      border-radius: 50%; width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; font-weight: bold;
    }

    .jugador-selector { display: flex; align-items: center; gap: 8px; }
    .jugador-selector select { padding: 8px; border-radius: 5px; border: 1px solid #ccc; }

    .stats-panel {
      background: white; border-radius: 10px; padding: 15px; margin-top: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .table-events { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .table-events th, .table-events td { border: 1px solid #dee2e6; padding: 8px; text-align: left; }
    .table-events th { background: #e9ecef; }
    .table-events td.tiempo-cell { cursor: pointer; color: #007bff; text-decoration: underline; }
    .table-events td.tiempo-cell:hover { color: #0056b3; }

    .hidden { display: none !important; }
    .loading-msg { color: #6c757d; margin-left: 10px; }

    .result-badge { padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; }
    .result-winner { background: #d4edda; color: #155724; }
    .result-out { background: #f8d7da; color: #721c24; }

    /* Nuevo estilo para las pestañas */
    .tabs { display: flex; gap: 5px; margin: 15px 0 0 0; }
    .tab-btn {
      padding: 10px 20px; background: #e9ecef; border: none; border-radius: 8px 8px 0 0;
      cursor: pointer; font-weight: bold; font-size: 1rem;
    }
    .tab-btn.active { background: #007bff; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .chart-container { width: 100%; max-width: 600px; margin: 20px auto; }
    canvas { width: 100%; height: auto; }
    .export-btns { display: flex; gap: 10px; margin-top: 10px; }
  </style>
</head>
<body>
<div class="container">

  <!-- Reproductor -->
  <div class="player-section">
    <div id="player-wrapper">
      <iframe id="youtube-frame" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    </div>
    <div class="controls-bar">
      <input type="text" id="urlInput" placeholder="Pega aquí el enlace de YouTube" value="https://www.youtube.com/watch?v=bTqG6zFnj3E">
      <button class="btn" onclick="cargarVideo()">▶️ Cargar</button>
      <span id="loading" class="loading-msg hidden">Cargando...</span>
      <span id="errorMsg" class="loading-msg hidden" style="color: red;"></span>
    </div>
  </div>

  <!-- Selector de jugador y herramientas -->
  <div class="controls-bar">
    <div class="jugador-selector">
      <label><strong>Jugador actual:</strong></label>
      <select id="jugadorActual"></select>
      <button class="btn btn-sm btn-success" onclick="agregarJugador()">➕ Añadir</button>
    </div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <button class="btn btn-sm btn-info" onclick="marcarResultado('winner')">🚀 Winner</button>
      <button class="btn btn-sm btn-danger" onclick="marcarResultado('out')">❌ Out</button>
      <button class="btn btn-sm btn-warning" onclick="reiniciarContadores()">🔄 Reiniciar</button>
    </div>
  </div>

  <!-- Botones de golpes -->
  <h2>Registro rápido de golpes</h2>
  <div id="golpesContainer" class="golpes-grid"></div>

  <!-- Pestañas -->
  <div class="tabs">
    <button id="btnTabEventos" class="tab-btn active" onclick="cambiarTab('eventos')">📋 Eventos</button>
    <button id="btnTabEstadisticas" class="tab-btn" onclick="cambiarTab('estadisticas')">📊 Estadísticas</button>
  </div>

  <!-- Panel de Eventos -->
  <div id="tab-eventos" class="tab-content active stats-panel">
    <h3>Eventos registrados</h3>
    <p><small>Hacé clic en el tiempo para revisar la jugada (retrocede 2 seg).</small></p>
    <table class="table-events">
      <thead><tr><th>Jugador</th><th>Tiempo</th><th>Golpe</th><th>Resultado</th></tr></thead>
      <tbody id="tablaEventos"></tbody>
    </table>
  </div>

  <!-- Panel de Estadísticas -->
  <div id="tab-estadisticas" class="tab-content stats-panel">
    <h3>Estadísticas del Partido</h3>
    <div class="chart-container">
      <canvas id="chartGolpes" width="400" height="250"></canvas>
    </div>
    <div class="chart-container">
      <canvas id="chartErrores" width="400" height="250"></canvas>
    </div>
    <div class="export-btns">
      <button class="btn btn-sm btn-success" onclick="exportarCSV()">📥 Exportar CSV</button>
      <button class="btn btn-sm btn-info" onclick="exportarJSON()">📥 Exportar JSON</button>
    </div>
  </div>

</div>

<script>
  // ---------- CONFIGURACIÓN ----------
  const golpesBase = [
    'Clear', 'Drop', 'Drop Slice', 'Smash', 'Stick Smash',
    'Bloqueo', 'Defensa', 'Defensa profunda', 'Lob', 'Lift', 'Dejada'
  ];
  const direcciones = ['Paralelo', 'Cruzado'];

  let iframe;
  let jugadores = JSON.parse(localStorage.getItem('jugadoresBadminton') || '[]');
  let jugadorSeleccionado = localStorage.getItem('jugadorActualBadminton') || '';
  let contadores = {};
  let eventos = [];

  function inicializarContadores() {
    golpesBase.forEach(golpe => {
      direcciones.forEach(dir => {
        const clave = `${golpe} ${dir}`;
        if (!(clave in contadores)) contadores[clave] = 0;
      });
    });
  }
  inicializarContadores();

  function guardarContadores() {
    localStorage.setItem('contadoresBadminton', JSON.stringify(contadores));
  }
  function cargarContadores() {
    const guardados = JSON.parse(localStorage.getItem('contadoresBadminton') || '{}');
    if (Object.keys(guardados).length > 0) contadores = guardados;
  }
  cargarContadores();

  function guardarEventos() {
    localStorage.setItem('eventosBadminton', JSON.stringify(eventos));
  }
  function cargarEventos() {
    const guardados = JSON.parse(localStorage.getItem('eventosBadminton') || '[]');
    if (guardados.length > 0) eventos = guardados;
    document.getElementById('tablaEventos').innerHTML = '';
    eventos.forEach((evento, index) => {
      agregarFilaTabla(index, evento.jugador, evento.tiempo, evento.tipo, evento.result);
    });
  }
  cargarEventos();

  // ---------- VIDEO ----------
  function extraerID(url) {
    const regex = /(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:watch\?v=|embed\/|v\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
    const match = url.match(regex);
    return match ? match[1] : null;
  }

  function cargarVideo() {
    const url = document.getElementById('urlInput').value.trim();
    document.getElementById('errorMsg').classList.add('hidden');
    document.getElementById('loading').classList.remove('hidden');
    if (!url) {
      mostrarError('Por favor pega un enlace de YouTube.');
      return;
    }
    const videoId = extraerID(url);
    if (!videoId) {
      mostrarError('No se pudo extraer el ID del vídeo. Revisa el enlace.');
      return;
    }
    iframe = document.getElementById('youtube-frame');
    iframe.src = `https://www.youtube.com/embed/${videoId}?enablejsapi=1&origin=${encodeURIComponent(window.location.origin)}`;
    document.getElementById('loading').classList.add('hidden');
  }

  function mostrarError(mensaje) {
    document.getElementById('errorMsg').textContent = mensaje;
    document.getElementById('errorMsg').classList.remove('hidden');
    document.getElementById('loading').classList.add('hidden');
  }

  window.addEventListener('message', (event) => {
    if (event.origin !== 'https://www.youtube.com') return;
    try {
      const data = JSON.parse(event.data);
      if (data.event === 'infoDelivery' && data.info && data.info.currentTime) {
        window.iframeCurrentTime = data.info.currentTime;
      }
    } catch(e) {}
  });

  function solicitarTiempo() {
    if (!iframe || !iframe.contentWindow) return;
    iframe.contentWindow.postMessage('{"event":"listening","id":1}', 'https://www.youtube.com');
  }
  setInterval(solicitarTiempo, 500);

  function seekTo(seconds) {
    if (!iframe || !iframe.contentWindow) return;
    iframe.contentWindow.postMessage(
      JSON.stringify({event: 'command', func: 'seekTo', args: [seconds, true]}),
      'https://www.youtube.com'
    );
  }

  // ---------- JUGADORES ----------
  function actualizarListaJugadores() {
    const select = document.getElementById('jugadorActual');
    select.innerHTML = jugadores.map(j => `<option value="${j}" ${j === jugadorSeleccionado ? 'selected' : ''}>${j}</option>`).join('');
    if (jugadores.length === 0) select.innerHTML = '<option value="">-- Sin jugador --</option>';
  }

  function agregarJugador() {
    const nombre = prompt('Nombre del jugador:');
    if (nombre && !jugadores.includes(nombre)) {
      jugadores.push(nombre);
      localStorage.setItem('jugadoresBadminton', JSON.stringify(jugadores));
      jugadorSeleccionado = nombre;
      localStorage.setItem('jugadorActualBadminton', nombre);
      actualizarListaJugadores();
    }
  }

  document.getElementById('jugadorActual').addEventListener('change', (e) => {
    jugadorSeleccionado = e.target.value;
    localStorage.setItem('jugadorActualBadminton', jugadorSeleccionado);
  });

  // ---------- REGISTRO DE GOLPES ----------
  function registrarGolpe(golpe, direccion) {
    if (!iframe || !iframe.src) { alert('Carga un video primero.'); return; }
    if (!jugadorSeleccionado) { alert('Selecciona o añade un jugador primero.'); return; }
    const tiempo = window.iframeCurrentTime;
    if (tiempo === undefined || tiempo === null) {
      alert('No se pudo obtener el tiempo del video. Espera unos segundos.');
      solicitarTiempo();
      return;
    }

    const clave = `${golpe} ${direccion}`;
    contadores[clave] = (contadores[clave] || 0) + 1;
    guardarContadores();
    actualizarBotonesContadores();

    const nuevoEvento = { jugador: jugadorSeleccionado, tiempo, tipo: clave, result: null };
    eventos.push(nuevoEvento);
    guardarEventos();
    agregarFilaTabla(eventos.length - 1, jugadorSeleccionado, tiempo, clave, null);
  }

  function agregarFilaTabla(index, jugador, tiempoSegundos, tipo, result) {
    const tbody = document.getElementById('tablaEventos');
    const fila = tbody.insertRow();
    fila.id = `row-${index}`;
    const minutos = Math.floor(tiempoSegundos / 60);
    const segundos = Math.floor(tiempoSegundos % 60);
    const tiempoFormateado = `${minutos}:${segundos.toString().padStart(2, '0')}`;

    fila.innerHTML = `
      <td>${jugador}</td>
      <td class="tiempo-cell" data-index="${index}" data-tiempo="${tiempoSegundos}">${tiempoFormateado}</td>
      <td>${tipo}</td>
      <td class="result-cell">${result ? `<span class="result-badge result-${result}">${result === 'winner' ? 'Winner' : 'Out'}</span>` : ''}</td>
    `;

    fila.querySelector('.tiempo-cell').addEventListener('click', function() {
      seekTo(Math.max(0, parseFloat(this.dataset.tiempo) - 2));
    });
  }

  function actualizarFilaResultado(index, result) {
    const fila = document.getElementById(`row-${index}`);
    if (!fila) return;
    const cell = fila.querySelector('.result-cell');
    cell.innerHTML = result ? `<span class="result-badge result-${result}">${result === 'winner' ? 'Winner' : 'Out'}</span>` : '';
  }

  function marcarResultado(result) {
    if (eventos.length === 0) { alert('No hay eventos registrados.'); return; }
    let lastIndex = -1;
    for (let i = eventos.length - 1; i >= 0; i--) {
      if (eventos[i].result === null) { lastIndex = i; break; }
    }
    if (lastIndex === -1) { alert('Todos los eventos ya tienen resultado asignado.'); return; }
    eventos[lastIndex].result = result;
    guardarEventos();
    actualizarFilaResultado(lastIndex, result);
  }

  // ---------- BOTONES ----------
  function crearBotones() {
    const container = document.getElementById('golpesContainer');
    container.innerHTML = '';
    golpesBase.forEach(golpe => {
      const card = document.createElement('div');
      card.className = 'golpe-card';
      const nombre = document.createElement('div');
      nombre.className = 'golpe-nombre';
      nombre.textContent = golpe;
      card.appendChild(nombre);
      const botonesDiv = document.createElement('div');
      botonesDiv.className = 'botones-golpe';

      direcciones.forEach(dir => {
        const clave = `${golpe} ${dir}`;
        const btn = document.createElement('button');
        btn.className = `btn-golpe ${dir === 'Paralelo' ? 'btn-paralelo' : 'btn-cruzado'}`;
        btn.innerHTML = `${dir} <span class="badge" id="cont-${clave.replace(/\s/g, '_')}">${contadores[clave] || 0}</span>`;
        btn.addEventListener('click', () => registrarGolpe(golpe, dir));
        botonesDiv.appendChild(btn);
      });
      card.appendChild(botonesDiv);
      container.appendChild(card);
    });
  }

  function actualizarBotonesContadores() {
    golpesBase.forEach(golpe => {
      direcciones.forEach(dir => {
        const clave = `${golpe} ${dir}`;
        const badge = document.getElementById(`cont-${clave.replace(/\s/g, '_')}`);
        if (badge) badge.textContent = contadores[clave] || 0;
      });
    });
  }

  function reiniciarContadores() {
    if (confirm('¿Estás seguro de reiniciar todos los contadores y eventos?')) {
      contadores = {};
      inicializarContadores();
      guardarContadores();
      eventos = [];
      guardarEventos();
      document.getElementById('tablaEventos').innerHTML = '';
      actualizarBotonesContadores();
    }
  }

  // ---------- PESTAÑAS (CORREGIDO) ----------
  function cambiarTab(tabId) {
    // Quitar activo de todos los botones y contenidos
    document.getElementById('btnTabEventos').classList.remove('active');
    document.getElementById('btnTabEstadisticas').classList.remove('active');
    document.getElementById('tab-eventos').classList.remove('active');
    document.getElementById('tab-estadisticas').classList.remove('active');

    if (tabId === 'eventos') {
      document.getElementById('btnTabEventos').classList.add('active');
      document.getElementById('tab-eventos').classList.add('active');
    } else {
      document.getElementById('btnTabEstadisticas').classList.add('active');
      document.getElementById('tab-estadisticas').classList.add('active');
      generarGraficos(); // solo cuando se muestra la pestaña
    }
  }

  // ---------- GRÁFICOS ----------
  let chartGolpes, chartErrores;

  function generarGraficos() {
    const frecuencias = {};
    golpesBase.forEach(golpe => frecuencias[golpe] = 0);
    eventos.forEach(e => {
      const base = e.tipo.split(' ')[0];
      if (frecuencias[base] !== undefined) frecuencias[base]++;
    });
    const labels = Object.keys(frecuencias);
    const data = Object.values(frecuencias);

    if (chartGolpes) chartGolpes.destroy();
    if (chartErrores) chartErrores.destroy();

    const ctx1 = document.getElementById('chartGolpes').getContext('2d');
    chartGolpes = new Chart(ctx1, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: 'Cantidad de golpes',
          data: data,
          backgroundColor: 'rgba(54, 162, 235, 0.7)'
        }]
      },
      options: { responsive: true, plugins: { title: { display: true, text: 'Frecuencia de Golpes' } } }
    });

    const conteo = { winner: 0, out: 0, sinMarcar: 0 };
    eventos.forEach(e => {
      if (e.result === 'winner') conteo.winner++;
      else if (e.result === 'out') conteo.out++;
      else conteo.sinMarcar++;
    });

    const ctx2 = document.getElementById('chartErrores').getContext('2d');
    chartErrores = new Chart(ctx2, {
      type: 'pie',
      data: {
        labels: ['Winners', 'Errores (Out)', 'Sin marcar'],
        datasets: [{
          data: [conteo.winner, conteo.out, conteo.sinMarcar],
          backgroundColor: ['#28a745', '#dc3545', '#ffc107']
        }]
      },
      options: { responsive: true, plugins: { title: { display: true, text: 'Resultados' } } }
    });
  }

  function exportarCSV() {
    let csv = 'Jugador,Tiempo (s),Golpe,Resultado\n';
    eventos.forEach(e => csv += `${e.jugador},${e.tiempo.toFixed(1)},${e.tipo},${e.result || ''}\n`);
    descargarArchivo(csv, 'eventos_badminton.csv', 'text/csv');
  }

  function exportarJSON() {
    descargarArchivo(JSON.stringify(eventos, null, 2), 'eventos_badminton.json', 'application/json');
  }

  function descargarArchivo(contenido, nombre, tipo) {
    const blob = new Blob([contenido], { type: tipo });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nombre; a.click();
    URL.revokeObjectURL(url);
  }

  // ---------- INICIO ----------
  actualizarListaJugadores();
  crearBotones();
  cargarVideo();
  cargarEventos();
</script>
</body>
</html>
